name: LoopGen CI
on:
  push:
    branches: ["loopgen-v0.9"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null
      - run: python -m pip install -U pip
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: python -m compileall -q src
      - name: Build source ZIP
        run: zip -qr LoopGen_Studio_v0.9.0.zip README.md REFERENCE_SPEC.md RELEASE_NOTES_v0.9.0.md pyproject.toml setup_loopgen.command run_loopgen.command src tests
      - uses: actions/upload-artifact@v4
        with:
          name: LoopGen_Studio_v0.9.0
          path: LoopGen_Studio_v0.9.0.zip
          retention-days: 30
