name: LoopGen CI
on:
  push:
    branches: ["loopgen-v0.9"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U pip
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: python -m compileall -q src
