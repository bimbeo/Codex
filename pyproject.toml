[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopgen-studio"
version = "0.9.0"
description = "Full-video Chinese to Vietnamese localization studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "requests>=2.32",
  "pillow>=10.4",
  "numpy>=1.26",
  "edge-tts>=6.1.12",
  "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
full = [
  "faster-whisper>=1.1.0",
  "rapidocr-onnxruntime>=1.4.4",
]
test = ["pytest>=8.0"]

[project.scripts]
loopgen-studio = "loopgen.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loopgen = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
